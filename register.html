<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resident Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #111;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #333;
        }

        .back-btn {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: white;
            color: #111;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Resident Registration</h1>

            <p class="subtitle">
                Create your resident account
            </p>

            <div id="message" class="message"></div>

            <form id="registerForm">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >


                <label for="contactNumber">
                    Contact Number
                </label>

                <input
                    type="text"
                    id="contactNumber"
                    placeholder="Enter your 11-digit contact number"
                    required
                    maxlength="11"
                    minlength="11"
                    pattern="[0-9]{11}"
                    inputmode="numeric"
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >


                <button
                    type="submit"
                    class="register-btn">
                    Register
                </button>

            </form>


            <button
                class="back-btn"
                onclick="location.href='login.html'">
                Back to Login
            </button>

        </div>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const fullName =
                    document.getElementById("fullName").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const contactNumber =
                    document.getElementById("contactNumber").value.trim();

                const password =
                    document.getElementById("password").value;


                // Create Supabase Auth account

                const {
                    data,
                    error
                } = await supabaseClient.auth.signUp({

                    email: email,

                    password: password

                });


                if (error) {

                    alert(error.message);

                    return;

                }


                // Check if Auth account was created

                if (!data.user) {

                    alert("Registration failed.");

                    return;

                }


                // Save resident information

                const {
                    error: profileError
                } = await supabaseClient
                    .from("users")
                    .insert([

                        {
                            full_name: fullName,

                            email: email,

                            contact_number: contactNumber,

                            role: "Resident"
                        }

                    ]);


                if (profileError) {

                    alert(
                        "Account created, but user information was not saved: "
                        + profileError.message
                    );

                    return;

                }


                alert(
                    "Registration successful! You can now login."
                );


                // Go to login page

                window.location.href = "login.html";

            });

    </script>

</body>
</html>
